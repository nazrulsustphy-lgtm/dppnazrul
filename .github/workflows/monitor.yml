name: DPP News Monitor

on:
  schedule:
    # Instant alerts: 8am, 2pm, 8pm Bangladesh time = 02, 08, 14 UTC
    - cron: '0 2,8,14 * * *'
    # Daily summary: 8:05am Bangladesh time = 02:05 UTC
    - cron: '5 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'instant'
        type: choice
        options:
          - instant
          - summary

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "summary" ]; then
              echo "flag=--summary" >> $GITHUB_OUTPUT
            else
              echo "flag=" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event.schedule }}" = "5 2 * * *" ]; then
            echo "flag=--summary" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py ${{ steps.mode.outputs.flag }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update state [skip ci]"
            git push
          fi
